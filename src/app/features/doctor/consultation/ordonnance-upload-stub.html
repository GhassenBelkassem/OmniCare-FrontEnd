<section class="ordonnance" aria-labelledby="ordonnance-title">
  <div class="ordonnance__head">
    <div>
      <h3 id="ordonnance-title">Photo d'ordonnance</h3>
      <p>Stub — selectionne une image, aucune lecture OCR reelle.</p>
    </div>
    @if (!currentText()) {
      <input #fileInput class="oc-sr-only" type="file" accept="image/*" aria-label="Choisir une image d'ordonnance" (change)="onFile($event)" />
      <oc-button variant="secondary" (click)="onPick()">Photographier l'ordonnance</oc-button>
    }
  </div>

  @if (currentText()) {
    <label class="field">
      <span>Prescription extraite (a verifier)</span>
      <textarea [value]="currentText()" (input)="update($event)" rows="4"></textarea>
    </label>
    <div class="form-actions">
      <oc-button variant="quiet" (click)="clear()">Recommencer</oc-button>
    </div>
  }
</section>
