<section class="scribe" aria-labelledby="scribe-title">
  <div class="scribe__head">
    <div>
      <h3 id="scribe-title">Scribe IA</h3>
      <p>Stub d'interface — aucun enregistrement audio ni appel IA reel.</p>
    </div>
    @if (state() === 'idle') {
      <oc-button variant="secondary" (click)="start()">Demarrer l'enregistrement</oc-button>
    } @else if (state() === 'draft') {
      <oc-button variant="quiet" (click)="restart()">Recommencer</oc-button>
    }
  </div>

  @if (state() === 'recording') {
    <p class="scribe__recording" role="status">Enregistrement en cours... (maquette)</p>
  } @else if (state() === 'draft') {
    <label class="field">
      <span>Brouillon SOAP</span>
      <textarea [value]="currentText()" (input)="update($event)" rows="6"></textarea>
    </label>
  }
</section>
