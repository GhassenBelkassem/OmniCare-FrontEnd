<fieldset class="vitals">
  <legend>Constantes (optionnelles)</legend>
  <div class="vitals-grid">
    <label>
      <span>TA systolique (mmHg)</span>
      <input type="number" inputmode="numeric" placeholder="120" [ngModel]="systolicBP()" name="systolicBP" (ngModelChange)="update('systolicBP', $event)" />
    </label>
    <label>
      <span>TA diastolique (mmHg)</span>
      <input type="number" inputmode="numeric" placeholder="80" [ngModel]="diastolicBP()" name="diastolicBP" (ngModelChange)="update('diastolicBP', $event)" />
    </label>
    <label>
      <span>Frequence cardiaque (bpm)</span>
      <input type="number" inputmode="numeric" placeholder="72" [ngModel]="heartRate()" name="heartRate" (ngModelChange)="update('heartRate', $event)" />
    </label>
    <label>
      <span>Temperature (°C)</span>
      <input type="number" inputmode="decimal" step="0.1" placeholder="36.8" [ngModel]="temperature()" name="temperature" (ngModelChange)="update('temperature', $event)" />
    </label>
    <label>
      <span>Poids (kg)</span>
      <input type="number" inputmode="decimal" step="0.1" placeholder="74" [ngModel]="weight()" name="weight" (ngModelChange)="update('weight', $event)" />
    </label>
  </div>
</fieldset>
