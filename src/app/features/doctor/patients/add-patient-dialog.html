<nz-modal
  [nzVisible]="open()"
  nzTitle="Nouveau patient"
  [nzFooter]="null"
  nzWidth="520px"
  (nzOnCancel)="close()"
>
  <ng-container *nzModalContent>
    <form class="add-patient-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    @if (duplicateId(); as existingPatientId) {
      <nz-alert
        class="add-patient-form__alert"
        nzType="warning"
        nzMessage="Numéro déjà utilisé"
        nzDescription="Un patient de votre pratique possède déjà ce numéro de téléphone."
        nzShowIcon
        [nzCloseable]="false"
      />
      <div class="add-patient-form__duplicate-actions">
        <oc-button variant="primary" size="small" (click)="onViewDuplicate()">
          Voir le dossier existant
        </oc-button>
      </div>
    }

    @if (submitError(); as message) {
      <nz-alert
        class="add-patient-form__alert"
        nzType="error"
        [nzMessage]="message"
        nzShowIcon
        [nzCloseable]="false"
      />
    }

    <div class="add-patient-form__row">
      <nz-form-item>
        <nz-form-label nzRequired for="add-patient-last-name">Nom</nz-form-label>
        <nz-form-control nzErrorIcon="exclamation-circle">
          <input
            id="add-patient-last-name"
            nz-input
            formControlName="lastName"
            autocomplete="family-name"
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired for="add-patient-first-name">Prénom</nz-form-label>
        <nz-form-control nzErrorIcon="exclamation-circle">
          <input
            id="add-patient-first-name"
            nz-input
            formControlName="firstName"
            autocomplete="given-name"
          />
        </nz-form-control>
      </nz-form-item>
    </div>

    <div class="add-patient-form__row">
      <nz-form-item>
        <nz-form-label nzRequired for="add-patient-dob">Date de naissance</nz-form-label>
        <nz-form-control nzErrorIcon="exclamation-circle">
          <input id="add-patient-dob" nz-input type="date" formControlName="dateOfBirth" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired for="add-patient-sex">Sexe</nz-form-label>
        <nz-form-control
          nzErrorIcon="exclamation-circle"
          [nzExtra]="'Valeurs acceptees : M, F ou autre'"
        >
          <input
            id="add-patient-sex"
            nz-input
            formControlName="sex"
            autocomplete="off"
            placeholder="M, F ou autre"
          />
        </nz-form-control>
      </nz-form-item>
    </div>

    <nz-form-item>
      <nz-form-label nzRequired for="add-patient-phone">Téléphone</nz-form-label>
      <nz-form-control
        nzErrorIcon="exclamation-circle"
        nzValidatingTip=""
        [nzExtra]="'Format international recommandé, ex : +216 71 234 567'"
      >
        <input
          id="add-patient-phone"
          nz-input
          type="tel"
          formControlName="phone"
          autocomplete="tel"
        />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label for="add-patient-email">Email</nz-form-label>
      <nz-form-control nzErrorIcon="exclamation-circle">
        <input
          id="add-patient-email"
          nz-input
          type="email"
          formControlName="email"
          autocomplete="email"
        />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label for="add-patient-address">Adresse</nz-form-label>
      <nz-form-control nzErrorIcon="exclamation-circle">
        <textarea
          id="add-patient-address"
          nz-input
          formControlName="address"
          rows="2"
        ></textarea>
      </nz-form-control>
    </nz-form-item>

    <div class="add-patient-form__actions">
      <oc-button variant="secondary" [type]="'button'" (click)="close()" [disabled]="saving()">
        Annuler
      </oc-button>
      <oc-button
        variant="primary"
        [type]="'submit'"
        [loading]="saving()"
        [disabled]="saving()"
      >
        {{ saving() ? 'Enregistrement...' : 'Créer le patient' }}
      </oc-button>
    </div>
    </form>
  </ng-container>
</nz-modal>
